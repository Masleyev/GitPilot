name: Build and Release GitPilot-RU

on:
  push:
    branches:
      - main
      - 'gitpilot-ru*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build GitPilot APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/GitPilot-RU.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitPilot-RU
          path: output/GitPilot-RU.apk

      - name: Publish APK to direct download branch
        if: github.ref == 'refs/heads/main'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B apk-download
          git add -f output/GitPilot-RU.apk
          git commit -m "release: build GitPilot-RU.apk"
          git push -f origin apk-download

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-ru
          name: "GitPilot-RU v1.0.0"
          body: "Русифицированная версия GitPilot для Android. Собрано через GitHub Actions."
          files: output/GitPilot-RU.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
